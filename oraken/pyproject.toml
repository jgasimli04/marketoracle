[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oraken"
version = "0.1.0"
description = "CLI tool for product CSV ingestion with vector embeddings and semantic search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Oraken Team", email = "dev@oraken.io" }
]
keywords = ["cli", "vector-search", "embeddings", "milvus", "pgvector", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
    "pymilvus>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg[pool]>=3.2.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
oraken = "oraken.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oraken"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
